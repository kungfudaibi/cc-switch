name: Sync upstream into personal fork

on:
  schedule:
    - cron: "0 5 * * *" # 13:00 China Standard Time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-fork-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'kungfudaibi/cc-switch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork main with history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream changes while keeping the login proxy commit
        shell: bash
        run: |
          git remote add upstream https://github.com/farion1231/cc-switch.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Fork main already includes upstream main."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit upstream/main
          git push origin HEAD:main
